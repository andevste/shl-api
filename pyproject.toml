[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shl-api"
version = "0.1.0"
description = "Python API client for the Swedish Hockey League (SHL)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment",
]
keywords = ["shl", "swedish hockey league", "hockey", "icehockey", "sports", "api", "home-assistant"]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
cli = [
    "rich>=12.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-requests",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
shl = "shl.cli:main"

[project.urls]
Homepage = "https://www.shl.se"
Repository = "https://github.com/stefan/shl-api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real SHL API (network required)",
]

[tool.coverage.run]
source = ["shl", "shl_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["shl", "shl_api"]
ignore_missing_imports = true
warn_unused_ignores = true

